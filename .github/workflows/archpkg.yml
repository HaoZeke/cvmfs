name: arch package of devel + passthrough fixes
on:
  push:
    branches: [ci/archpkg]
permissions:
  contents: read
jobs:
  makepkg:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        src: [passthrough-fixes, devel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.src == 'devel' && 'cvmfs/cvmfs' || github.repository }}
          ref: ${{ matrix.src }}
          path: src-fixes
      - name: toolchain and dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git fuse3 fuse2 curl c-ares pacparser sqlite leveldb cmake gtest sparsehash help2man python libcap util-linux-libs openssl zlib attr valgrind
          useradd -m builder
          cp -r ci-archpkg /home/builder/pkg
          mv src-fixes cvmfs-passthrough-fixes && tar czf /home/builder/pkg/cvmfs-passthrough-fixes.tar.gz cvmfs-passthrough-fixes
          chown -R builder /home/builder/pkg
      - name: makepkg
        run: |
          cd /home/builder/pkg
          su builder -c "MAKEFLAGS=-j$(nproc) makepkg -f --noconfirm --nodeps" 2>&1 | tail -60
          ls -la *.pkg.tar.zst
          for f in src/cvmfs-passthrough-fixes/build/cvmfs/libcvmfs_fuse3.so; do ldd "$f" | grep -i proto || echo "no shared protobuf"; done
          pacman -Q curl fuse3 > versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cvmfs-${{ matrix.src }}
          path: |
            /home/builder/pkg/*.pkg.tar.zst
            /home/builder/pkg/versions.txt
  devel-compile:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: passthrough-fixes
      - name: dependencies
        run: pacman -Syu --noconfirm --needed base-devel git fuse3 fuse2 curl c-ares pacparser sqlite leveldb cmake gtest sparsehash help2man python libcap util-linux-libs openssl zlib attr
      - name: configure and build the client
        run: |
          cmake -S . -B build -DBUILD_SERVER=OFF -DBUILD_RECEIVER=OFF -DBUILD_LIBCVMFS=OFF -DBUILD_LIBCVMFS_CACHE=OFF -DBUILD_SHRINKWRAP=OFF -DBUILD_GATEWAY=OFF -DBUILD_DUCC=OFF -DBUILD_SNAPSHOTTER=OFF -DBUILD_UNITTESTS=OFF -DBUILTIN_EXTERNALS_LIST="libcrypto"
          cmake --build build -j"$(nproc)"
  mockfuse-tests:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        tree: [passthrough-fixes, devel-with-new-tests]
    steps:
      - name: dependencies
        run: pacman -Syu --noconfirm --needed base-devel git fuse3 fuse2 curl c-ares pacparser sqlite leveldb cmake gtest sparsehash help2man python libcap util-linux-libs openssl zlib attr protobuf
      - name: source
        run: |
          git clone -q https://github.com/HaoZeke/cvmfs.git src
          cd src && git fetch -q https://github.com/cvmfs/cvmfs.git devel && git checkout -q origin/passthrough-fixes
          if [ "${{ matrix.tree }}" = devel-with-new-tests ]; then
            # stock devel code, this branch's tests and libfuse stubs
            git checkout -q FETCH_HEAD -- cvmfs
          fi
          git log --oneline -1
      - name: build the mockfuse unit tests
        run: |
          cd src
          cmake -S . -B build -DBUILD_SERVER=OFF -DBUILD_RECEIVER=OFF -DBUILD_LIBCVMFS=OFF -DBUILD_LIBCVMFS_CACHE=OFF -DBUILD_SHRINKWRAP=OFF -DBUILD_GATEWAY=OFF -DBUILD_DUCC=OFF -DBUILD_SNAPSHOTTER=OFF -DBUILD_UNITTESTS=ON -DBUILTIN_EXTERNALS_LIST="libcrypto"
          cmake --build build -j"$(nproc)" --target cvmfs_unittests_mockfuse
      - name: run T_Cvmfs*
        run: |
          cd src/build
          ./test/unittests/cvmfs_unittests_mockfuse --gtest_filter='T_Cvmfs*' 2>&1 | tail -40
