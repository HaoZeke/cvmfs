name: arch package 2.14.1 + passthrough fixes
on:
  push:
    branches: [ci/archpkg]
permissions:
  contents: read
jobs:
  makepkg:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: toolchain and dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git fuse3 fuse2 curl c-ares pacparser sqlite leveldb cmake gtest sparsehash help2man python protobuf libcap util-linux-libs openssl zlib attr valgrind
          useradd -m builder
          cp -r ci-archpkg /home/builder/pkg && chown -R builder /home/builder/pkg
      - name: makepkg
        run: |
          cd /home/builder/pkg
          su builder -c "MAKEFLAGS=-j$(nproc) makepkg -f --noconfirm --nodeps" 2>&1 | tail -60
          ls -la *.pkg.tar.zst
          pacman -Q curl fuse3 > versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cvmfs-2.14.1-4
          path: |
            /home/builder/pkg/*.pkg.tar.zst
            /home/builder/pkg/versions.txt
  devel-compile:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/passthrough-eperm-fallback
      - name: dependencies
        run: pacman -Syu --noconfirm --needed base-devel git fuse3 fuse2 curl c-ares pacparser sqlite leveldb cmake gtest sparsehash help2man python protobuf libcap util-linux-libs openssl zlib attr
      - name: configure and build the client
        run: |
          cmake -S . -B build -DBUILD_SERVER=OFF -DBUILD_RECEIVER=OFF -DBUILD_LIBCVMFS=OFF -DBUILD_LIBCVMFS_CACHE=OFF -DBUILD_SHRINKWRAP=OFF -DBUILD_GATEWAY=OFF -DBUILD_DUCC=OFF -DBUILD_SNAPSHOTTER=OFF -DBUILD_UNITTESTS=OFF -DBUILTIN_EXTERNALS_LIST="libcrypto;sha3"
          cmake --build build -j"$(nproc)"
